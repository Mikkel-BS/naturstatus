name: Validate pull requests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data and site
        run: |
          python -m unittest discover -s tests
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s map.js
          node --check app.js
          node --check map.js
      - name: Verify SSB integration against live official statistics
        run: |
          python scripts/check_map_sources.py
          python scripts/update_ssb.py
          python -m unittest discover -s tests
