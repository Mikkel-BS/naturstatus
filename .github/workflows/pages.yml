name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Update official SSB data']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and prepare distributable
        run: |
          python -m unittest discover -s tests
          mkdir -p dist/data
          cp index.html styles.css app.js map.js goal.js ecosystems.js nature_history.js .nojekyll dist/
          cp data/overview.csv data/historical.json data/targets.json data/ecosystems.json data/nature_index_history.json data/nature_index_history.csv dist/data/
          if [ -f data/historical.csv ]; then cp data/historical.csv dist/data/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
