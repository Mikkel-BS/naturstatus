name: Refresh Nature Index history (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-nature-index-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch, check and test published reference years
        run: |
          python scripts/update_nature_index.py
          python -m unittest discover -s tests
          node --check nature_history.js
      - name: Commit verified changes (if any)
        run: |
          if git diff --quiet -- data/nature_index_history.json data/nature_index_history.csv; then
            echo "The archived Nature Index release has not changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nature_index_history.json data/nature_index_history.csv
          git commit -m "data: update verified Nature Index 2025 history"
          git push
